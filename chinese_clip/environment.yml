name: embedding
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy
  - pillow
  - requests
  - uvicorn
  - pip:
      - oss2
      - tqdm
      - openai
      - fastapi==0.115.12
      - pydantic==2.11.0
      - torch==2.6.0
      - torchaudio==2.6.0
      - transformers==4.34.0
      - modelscope
      - opencv-python-headless  
prefix: /opt/conda/envs/embedding
